<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteor Run</title>
<style>
:root{--bg:#050816;--ink:#e8f1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif}
#stage{position:relative;background:#070b1f;box-shadow:0 0 0 1px #1b2447}
canvas{width:100%;height:100%;display:block}
#fire{display:none;position:absolute;right:14px;bottom:14px;width:84px;height:84px;border-radius:50%;border:2px solid #38a3ff;background:#38a3ff33;color:var(--ink);font:600 16px "Trebuchet MS",system-ui,sans-serif}
#fire:active{background:#38a3ff88}
#mute{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:none;border:1px solid #1b2447;color:#8fa2d6;border-radius:14px;padding:4px 10px;font:14px "Trebuchet MS",system-ui,sans-serif}
#hb{position:absolute;left:50%;top:74%;transform:translateX(-50%);background:#38a3ff22;border:2px solid #38a3ff;color:var(--ink);border-radius:28px;padding:14px 40px;font:600 24px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
#hg{position:absolute;inset:0;z-index:5;background:#050816f2;overflow:auto;touch-action:pan-y;display:flex}
#hg[hidden]{display:none}
#hp{margin:auto;padding:16px;text-align:center;max-width:100%}
#hp h2{margin:0 0 6px;font-size:26px}#hp h3{margin:14px 0 6px;font-size:15px;color:#8fa2d6;font-weight:600}
#hp p{margin:4px 0;color:#8fa2d6;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.row button,#hd{background:#0d1330;border:1px solid #1b2447;color:var(--ink);border-radius:12px;padding:6px 10px;font:14px "Trebuchet MS",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.row button.on{border-color:#38a3ff;background:#38a3ff33}
.row button.lock{opacity:.45;cursor:not-allowed}
.row small{color:#ffe58a;font-size:12px}
.row i{width:12px;height:12px;border-radius:50%;display:inline-block}
#hd{margin:16px auto 0;padding:8px 26px;border-color:#38a3ff}
@media (pointer:coarse){#fire{display:block}}
</style>
</head>
<body>
<div id="stage"><canvas id="g" width="480" height="720"></canvas><button id="fire" type="button">Fire</button><button id="mute" type="button" aria-label="Toggle sound">Sound on</button><button id="hb" type="button">Hangar</button><div id="hg" hidden><div id="hp"><h2>Hangar</h2><canvas id="pv" width="280" height="240" style="width:140px;height:120px"></canvas><p id="bs"></p><div id="hbody"></div><button id="hd" type="button">Done</button></div></div></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=480,H=720,stage=document.getElementById('stage');
let S=1,lvUp=false,newU=[],hangarOpen=false,st='start',score=0,ammo=3,t=0,ship,rocks=[],orbs=[],shots=[],fx=[],spR=0,spO=0,best=0,target=null,dead=0,last=0;
const keys={},stars=[];
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,d,type,vol){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d)}
function noise(d,vol,fr){const a=ac();if(!a||muted)return;const len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),n=a.currentTime;s.buffer=b;fl.type='lowpass';fl.frequency.value=fr;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(fl).connect(g).connect(a.destination);s.start(n)}
function sfx(k){if(k==='shoot')tone(900,200,.12,'square',.07);else if(k==='empty')tone(150,100,.06,'square',.05);else if(k==='boom'){noise(.25,.25,1200);tone(160,40,.2,'sawtooth',.1)}else if(k==='orb'){tone(500,1000,.12,'sine',.12);setTimeout(()=>tone(800,1400,.12,'sine',.1),70)}else if(k==='start'){tone(300,600,.1,'square',.08);setTimeout(()=>tone(450,900,.1,'square',.08),90);setTimeout(()=>tone(600,1500,.25,'square',.08),180)}else if(k==='die'){noise(.7,.45,900);tone(200,30,.6,'sawtooth',.15)}}
let mGain=null,nextT=0,step=0;
const CH=[[110,[440,523.25,659.25]],[87.31,[349.23,440,523.25]],[130.81,[523.25,659.25,783.99]],[98,[392,493.88,587.33]]],
BASS=[1,1,2,1,1,1,2,1],ARP=[0,1,2,1,0,1,2,1],
LEAD=[659,0,659,587,523,0,587,659, 698,0,698,659,587,0,523,587, 784,0,784,659,523,0,659,784, 587,0,587,494,392,0,494,587];
function note(f,when,d,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.01);g.gain.exponentialRampToValueAtTime(.0001,when+d);o.connect(g).connect(mGain);o.start(when);o.stop(when+d+.02)}
function nz(when,d,vol,fr,type){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type=type;fl.frequency.value=fr;g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+d);s.connect(fl).connect(g).connect(mGain);s.start(when)}
function kick(when){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,when);o.frequency.exponentialRampToValueAtTime(40,when+.12);g.gain.setValueAtTime(.3,when);g.gain.exponentialRampToValueAtTime(.0001,when+.15);o.connect(g).connect(mGain);o.start(when);o.stop(when+.2)}
function music(){const a=ac();if(!a||mGain)return;mGain=a.createGain();mGain.gain.value=0;mGain.connect(a.destination);nextT=a.currentTime+.1;setInterval(sched,100)}
function musicVol(){if(!mGain)return;mGain.gain.cancelScheduledValues(AC.currentTime);mGain.gain.setValueAtTime(muted||st!=='play'?0:.9,AC.currentTime)}
function musicStart(){if(!AC)return;step=0;nextT=AC.currentTime+.08;musicVol()}
function musicStop(){if(!mGain)return;mGain.gain.cancelScheduledValues(AC.currentTime);mGain.gain.setTargetAtTime(0,AC.currentTime,.06)}
function sched(){if(!AC||AC.state!=='running'||st!=='play')return;if(nextT<AC.currentTime)nextT=AC.currentTime+.05;const sd=.2/(.5+Math.min(1.4,t*.022));
while(nextT<AC.currentTime+.4){const ch=CH[Math.floor(step/8)%4],i=step%8,l=LEAD[step%32];
note(ch[0]*BASS[i],nextT,sd*.9,'triangle',.14);note(ch[1][ARP[i]],nextT,sd*.8,'square',.02);if(l)note(l,nextT,sd*.85,'square',.05);
if(i===0||i===4)kick(nextT);if(i===2||i===6)nz(nextT,.12,.1,1500,'highpass');if(i%2)nz(nextT,.04,.05,7000,'highpass');
step++;nextT+=sd}}
function toggleMute(){muted=!muted;musicVol();document.getElementById('mute').textContent=muted?'Sound off':'Sound on'}
try{best=+localStorage.getItem('meteor-best2')||0}catch(e){}
const SH=[['Dart',0],['Wing',100],['Hawk',250],['Saucer',500]],
HU=[['Frost','#e8f1ff',0],['Mint','#7dffb2',50],['Rose','#ff7ab8',125],['Gold','#ffd24a',200],['Violet','#b48cff',300],['Ice','#7fe9ff',400]],
FL=[['Ember','#ff9a5a',0],['Blue','#38a3ff',75],['Lime','#a6ff4d',150],['Pink','#ff5fd0',350]];
let sk={s:0,h:0,f:0};
try{const j=JSON.parse(localStorage.getItem('meteor-skin3'));if(j)sk={s:j.s|0,h:j.h|0,f:j.f|0}}catch(e){}
[['s',SH,1],['h',HU,2],['f',FL,2]].forEach(([k,L,j])=>{if(!L[sk[k]]||best<L[sk[k]][j])sk[k]=0});
for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.6+.4});
function fit(){const h=Math.min(document.body.clientHeight,document.body.clientWidth*1.5);stage.style.height=h+'px';stage.style.width=h/1.5+'px';S=Math.min(3,Math.max(1,h/1.5/W*(window.devicePixelRatio||1)));c.width=Math.round(W*S);c.height=Math.round(H*S)}
addEventListener('resize',fit);fit();
function reset(){score=0;ammo=3;t=0;ship={x:W/2,y:H-90,r:15,cd:0};rocks=[];orbs=[];shots=[];fx=[];spR=.5;spO=4;target=null;st='play'}
function shoot(){if(st!=='play'||ship.cd>0)return;if(ammo<1){sfx('empty');ship.cd=.3;return}shots.push({x:ship.x,y:ship.y-20});ammo--;ship.cd=.17;sfx('shoot')}
function boom(px,py,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*180;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,col})}}
function lv(){return t*2}
function mkRock(){const r=14+Math.random()*22,n=9,pts=[];for(let i=0;i<n;i++){const a=i/n*6.283,d=r*(.75+Math.random()*.4);pts.push([Math.cos(a)*d,Math.sin(a)*d])}
const sp=Math.min(720,120+lv()*4.5)*(.8+Math.random()*.5);
rocks.push({x:r+Math.random()*(W-2*r),y:-r-10,r,vy:sp,vx:(Math.random()-.5)*Math.min(200,20+lv()*2),a:0,w:(Math.random()-.5)*3,pts})}
function die(){st='over';dead=performance.now();sfx('die');musicStop();boom(ship.x,ship.y,'#e8f1ff',40);boom(ship.x,ship.y,'#ff9a5a',30);
const s=Math.floor(score),old=best;if(s>best){best=s;try{localStorage.setItem('meteor-best2',s)}catch(e){}}
newU=[];[SH,HU,FL].forEach((L,k)=>L.forEach(it=>{const th=k?it[2]:it[1];if(th>old&&th<=best)newU.push(it[0])}));}
function update(dt){
if(st==='play'){
t+=dt;score+=dt*1;ship.cd-=dt;
let m=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
if(m)ship.x+=m*400*dt;else if(target!==null)ship.x+=(target-ship.x)*Math.min(1,dt*14);
ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x));
if(keys[' ']||keys.w||keys.ArrowUp)shoot();
spR-=dt;if(spR<=0){mkRock();spR=Math.max(.12,.85-lv()*.011)*(.6+Math.random()*.8)}
spO-=dt;if(spO<=0){orbs.push({x:20+Math.random()*(W-40),y:-20,r:11,vy:130});spO=5+Math.random()*4}
for(const s of shots)s.y-=620*dt;
shots=shots.filter(s=>s.y>-20);
for(const r of rocks){r.y+=r.vy*dt;r.x+=r.vx*dt;r.a+=r.w*dt;if(r.x<r.r||r.x>W-r.r)r.vx*=-1}
for(const o of orbs)o.y+=o.vy*dt;
for(const r of rocks)for(const s of shots){if(!r.dead&&!s.dead&&Math.hypot(r.x-s.x,r.y-s.y)<r.r+4){r.dead=s.dead=1;score+=5;boom(r.x,r.y,'#d98a6a',14);sfx('boom')}}
for(const o of orbs)if(Math.hypot(o.x-ship.x,o.y-ship.y)<o.r+ship.r){o.dead=1;ammo=Math.min(15,ammo+4);boom(o.x,o.y,'#38a3ff',12);sfx('orb')}
for(const r of rocks)if(!r.dead&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r*.9+ship.r*.7){die();break}
rocks=rocks.filter(r=>!r.dead&&r.y<H+60);orbs=orbs.filter(o=>!o.dead&&o.y<H+30);shots=shots.filter(s=>!s.dead);
}
for(const s of stars){s.y+=s.z*(st==='play'?30+t:20)*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}
for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
fx=fx.filter(p=>p.l>0);
}
function txt(s,px,py,size,col,al,mw){x.font='600 '+size+'px "Trebuchet MS",system-ui,sans-serif';x.fillStyle=col||'#e8f1ff';x.textAlign=al||'center';x.fillText(s,px,py,mw||W-24)}
function draw(){
x.setTransform(S,0,0,S,0,0);hb.hidden=st==='play';
x.fillStyle='#070b1f';x.fillRect(0,0,W,H);
for(const s of stars){x.fillStyle='rgba(200,220,255,'+(.25+s.z*.25)+')';x.fillRect(s.x,s.y,s.z,s.z*1.5)}
for(const o of orbs){const g=x.createRadialGradient(o.x,o.y,2,o.x,o.y,o.r*2.2);g.addColorStop(0,'#bfe3ff');g.addColorStop(.35,'#38a3ff');g.addColorStop(1,'rgba(56,163,255,0)');x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,o.r*2.2,0,6.283);x.fill()}
for(const r of rocks){x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();r.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle='#8a5a4a';x.fill();x.strokeStyle='#d98a6a';x.lineWidth=2;x.stroke();x.restore()}
x.fillStyle='#ffe58a';for(const s of shots)x.fillRect(s.x-2,s.y-9,4,14);
if(st!=='over'||performance.now()-dead<0){drawShip()}
for(const p of fx){x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;
txt(Math.floor(score),16,38,28,'#e8f1ff','left');
txt('Best '+best,W-16,34,16,'#8fa2d6','right');
txt('Ammo',16,H-38,14,'#8fa2d6','left');
for(let i=0;i<15;i++){x.fillStyle=i<ammo?'#ffe58a':'#1b2447';x.fillRect(16+i*10,H-28,6,14)}
if(st==='start'){panel();txt('Meteor Run',W/2,H/2-70,44);
txt('Left / Right or drag to steer',W/2,H/2-20,18,'#b9c7ee');
txt('Shoot: Space, W or Up arrow',W/2,H/2+10,18,'#b9c7ee');
txt('Blue orbs give ammo',W/2,H/2+40,18,'#38a3ff');
txt('Press Space or tap to start',W/2,H/2+95,20);txt('Best '+best+(nextU()?'   Next unlock at '+nextU():''),W/2,H/2+135,16,'#8fa2d6')}
if(st==='over'){panel();txt('Ship destroyed',W/2,H/2-60,38);
txt('Score '+Math.floor(score),W/2,H/2-10,26);
txt(Math.floor(score)>=best?'New best score':'Best '+best,W/2,H/2+25,18,'#8fa2d6');
if(newU.length)txt('Unlocked: '+newU.join(', '),W/2,H/2+60,18,'#ffe58a');else if(nextU())txt('Next unlock at '+nextU(),W/2,H/2+60,16,'#8fa2d6');
txt('Press Space or tap to fly again',W/2,H/2+100,20)}
}
function nextU(){return[...SH.map(i=>i[1]),...HU.map(i=>i[2]),...FL.map(i=>i[2])].filter(v=>v>best).sort((a,b)=>a-b)[0]}
function panel(){x.fillStyle='rgba(5,8,22,.78)';x.fillRect(0,0,W,H)}
const PTS=[[[0,-20],[15,16],[0,8],[-15,16]],[[0,-18],[7,-4],[18,14],[7,9],[0,15],[-7,9],[-18,14],[-7,-4]],[[0,-22],[5,-8],[16,-2],[12,16],[0,10],[-12,16],[-16,-2],[-5,-8]]];
function paint(c2,cx,cy,k,f){const hu=HU[k.h][1],fl=FL[k.f][1];
c2.fillStyle=fl;c2.beginPath();c2.moveTo(cx-6,cy+13);c2.lineTo(cx,cy+13+f);c2.lineTo(cx+6,cy+13);c2.fill();
c2.fillStyle=hu;c2.beginPath();
if(k.s===3){c2.ellipse(cx,cy+5,18,8,0,0,6.283);c2.moveTo(cx+10,cy+1);c2.arc(cx,cy+1,10,0,Math.PI,true)}
else{PTS[k.s].forEach((p,i)=>i?c2.lineTo(cx+p[0],cy+p[1]):c2.moveTo(cx+p[0],cy+p[1]));c2.closePath()}
c2.fill();c2.fillStyle=fl;c2.beginPath();c2.arc(cx,cy+(k.s===3?1:0),4,0,6.283);c2.fill()}
function drawShip(){if(st==='over')return;paint(x,ship.x,ship.y,sk,8+Math.random()*8)}
function hangar(){
const row=(t,key,L)=>'<h3>'+t+'</h3><div class="row">'+L.map((it,i)=>{const th=key==='s'?it[1]:it[2],ok=best>=th;return '<button type="button" data-k="'+key+'" data-i="'+i+'" class="'+(sk[key]===i?'on ':'')+(ok?'':'lock')+'">'+(key==='s'?'':'<i style="background:'+it[1]+'"></i>')+it[0]+(ok?'':'<small>Score '+th+'</small>')+'</button>'}).join('')+'</div>';
document.getElementById('hbody').innerHTML=row('Ship','s',SH)+row('Hull','h',HU)+row('Flame','f',FL);
document.getElementById('bs').textContent='Best score: '+best+(nextU()?'. Next unlock at '+nextU()+'.':'. Everything unlocked.');
const c2=document.getElementById('pv').getContext('2d');c2.setTransform(2,0,0,2,0,0);c2.clearRect(0,0,140,120);c2.save();c2.translate(70,60);c2.scale(2.2,2.2);paint(c2,0,0,sk,12);c2.restore()}
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function go(){if(hangarOpen)return;ac();music();if(st==='start'||(st==='over'&&performance.now()-dead>600)){reset();sfx('start');musicStart()}}
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(hangarOpen){if(k==='Escape')closeH();return}if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k))e.preventDefault();if(k===' '||k==='Enter')go();if(k==='m')toggleMute();keys[k]=true});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
function px(e){const b=c.getBoundingClientRect();return(e.clientX-b.left)*W/b.width}
c.addEventListener('pointerdown',e=>{go();if(st==='play')target=px(e);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(e.buttons&&st==='play')target=px(e)});
c.addEventListener('pointerup',()=>{target=null});
document.getElementById('fire').addEventListener('pointerdown',e=>{e.stopPropagation();shoot()});
const hg=document.getElementById('hg'),hb=document.getElementById('hb');
function openH(){hangarOpen=true;hg.hidden=false;hangar();document.getElementById('hd').focus()}
function closeH(){hangarOpen=false;hg.hidden=true;if(document.activeElement)document.activeElement.blur()}
hb.addEventListener('click',openH);document.getElementById('hd').addEventListener('click',closeH);
document.getElementById('hbody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('lock'))return;sk[b.dataset.k]=+b.dataset.i;try{localStorage.setItem('meteor-skin3',JSON.stringify(sk))}catch(er){}hangar()});
document.getElementById('mute').addEventListener('click',e=>{toggleMute();e.currentTarget.blur()});
reset();st='start';requestAnimationFrame(loop);
</script>
</body>
</html>
